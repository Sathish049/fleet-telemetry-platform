# Fleet Telemetry Platform - start everything with:  docker compose up --build
#
#   simulator -> ingest (Go) -> Redis stream -> writer (Go) -> MySQL -> api (FastAPI) -> dashboard (React)
#                     \___________________ Prometheus scrapes metrics -> Grafana ___/

services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist the stream to disk
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: fleet
    command: ["--default-time-zone=+00:00"]
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ufleet", "-pfleet"]
      interval: 5s
      retries: 30

  ingest:
    build: ./ingest-service
    command: ["ingest"]
    environment:
      REDIS_ADDR: redis:6379
      LISTEN_ADDR: ":8080"
    ports: ["8081:8080"]
    depends_on:
      redis: { condition: service_healthy }

  writer:
    build: ./ingest-service
    command: ["writer"]
    environment:
      REDIS_ADDR: redis:6379
      MYSQL_DSN: "fleet:fleet@tcp(mysql:3306)/fleet?parseTime=true&loc=UTC&time_zone=%27%2B00%3A00%27"
      RETENTION_DAYS: "7"
    ports: ["9101:9101"]
    depends_on:
      redis: { condition: service_healthy }
      mysql: { condition: service_healthy }

  api:
    build: ./api
    environment:
      DATABASE_URL: mysql+pymysql://fleet:fleet@mysql:3306/fleet
    ports: ["8000:8000"]
    depends_on:
      mysql: { condition: service_healthy }

  dashboard:
    build: ./dashboard
    ports: ["3000:80"]
    depends_on: [api]

  simulator:
    build: ./simulator
    command: ["--url", "ws://ingest:8080/ws", "--vehicles", "${VEHICLES:-100}", "--interval", "${INTERVAL:-1}", "--fault-rate", "0.0002"]
    depends_on: [ingest]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  redis-data:
  mysql-data:
